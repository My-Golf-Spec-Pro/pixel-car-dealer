<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クルマ屋経営シミュレーション</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #12131a;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    #game-container {
      width: 1000px;
      background-color: #1f222e;
      border: 3px solid #3b4259;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.7);
    }
    
    /* ステータスヘッダー */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #28334a 0%, #1a2336 100%);
      padding: 10px 20px;
      border-bottom: 2px solid #3b4d6b;
      font-size: 15px;
      font-weight: bold;
    }
    .status-item {
      background: #111827;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #374151;
    }
    .status-item span { color: #38bdf8; font-size: 17px; }

    /* ゲームCanvas領域 */
    .canvas-wrapper {
      position: relative;
      width: 1000px;
      height: 520px;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* ガイドメッセージ */
    .message-box {
      background: #0f172a;
      border-top: 2px solid #1e293b;
      padding: 10px 20px;
      color: #fde047;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 下部操作メニュー */
    .control-panel {
      padding: 12px 20px;
      background: #171923;
    }
    .car-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .car-card {
      background: #2d3748;
      border: 2px solid #4a5568;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .car-card:hover:not(.disabled) {
      background: #3b495e;
      border-color: #6366f1;
      transform: translateY(-2px);
    }
    .car-card.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .car-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; color: #f3f4f6; }
    .car-price { font-size: 11px; color: #38bdf8; font-weight: bold; }

    .action-buttons {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sell { background: #059669; }
    .btn-sell:hover:not(:disabled) { background: #10b981; }
    button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="status-bar">
    <div class="status-item">クルマ屋 <span>Lv.1</span></div>
    <div class="status-item">資金: <span id="money">500</span>万円</div>
    <div class="status-item">展示数: <span id="car-count">0</span>/3</div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="1000" height="520"></canvas>
  </div>

  <div class="message-box" id="message">
    開店しました！下の車種から好きな車を選んで展示場に並べましょう。
  </div>

  <div class="control-panel">
    <div class="car-selector">
      <div class="car-card" id="car-0" onclick="buyCar(0)">
        <div class="car-name">ミニスマイル</div>
        <div class="car-price">仕入: 80万円</div>
      </div>
      <div class="car-card" id="car-1" onclick="buyCar(1)">
        <div class="car-name">シティラン</div>
        <div class="car-price">仕入: 100万円</div>
      </div>
      <div class="car-card" id="car-2" onclick="buyCar(2)">
        <div class="car-name">ファミリア8</div>
        <div class="car-price">仕入: 220万円</div>
      </div>
      <div class="car-card" id="car-3" onclick="buyCar(3)">
        <div class="car-name">ワイルドクロス</div>
        <div class="car-price">仕入: 250万円</div>
      </div>
      <div class="car-card" id="car-4" onclick="buyCar(4)">
        <div class="car-name">ロイヤルセダン</div>
        <div class="car-price">仕入: 350万円</div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-sell" id="sell-btn" onclick="sellCar()" disabled>商談して売却する</button>
    </div>
  </div>
</div>

<script>
  // --- 5車種のデータ ---
  const CAR_TYPES = [
    { id: 0, name: 'ミニスマイル', cost: 80, sell: 110, type: 'compact_red' },
    { id: 1, name: 'シティラン', cost: 100, sell: 140, type: 'compact_blue' },
    { id: 2, name: 'ファミリア8', cost: 220, sell: 290, type: 'minivan_gray' },
    { id: 3, name: 'ワイルドクロス', cost: 250, sell: 330, type: 'suv_red' },
    { id: 4, name: 'ロイヤルセダン', cost: 350, sell: 460, type: 'sedan_black' }
  ];

  // 展示用ラグの座標
  const RUG_POSITIONS = [
    { x: 380, y: 110 },
    { x: 380, y: 220 },
    { x: 380, y: 330 }
  ];

  let gameState = {
    money: 500,
    cars: [null, null, null]
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- 描画処理 ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 店舗背景（タイルの床と青壁）
    ctx.fillStyle = '#e8ecf1';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // タイル目地
    ctx.strokeStyle = '#d0d7de';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 30) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 周囲の壁（青ライン）
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(0, 0, canvas.width, 16);
    ctx.fillRect(0, 0, 16, canvas.height);
    ctx.fillRect(canvas.width - 16, 0, 16, canvas.height);
    ctx.fillRect(0, canvas.height - 16, canvas.width, 16);

    // 2. 店舗内インテリア
    // カウンターデスク (左下)
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(40, 360, 180, 70);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(50, 370, 160, 20);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(80, 335, 30, 25); // PC画面

    // 応対セット (左上)
    ctx.fillStyle = '#b45309';
    ctx.fillRect(60, 60, 80, 50); // テーブル
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(35, 65, 20, 40); // 椅子左
    ctx.fillRect(145, 65, 20, 40); // 椅子右

    // 商談スペース (右上)
    ctx.fillStyle = '#1e3a8a';
    ctx.fillRect(720, 50, 220, 130);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(750, 75, 160, 50); // ソファ

    // ピット作業場 (右下)
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.strokeRect(720, 280, 220, 180);
    ctx.fillStyle = '#334155';
    ctx.fillRect(730, 290, 140, 50); // 工具キャビネット
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(900, 320, 18, 0, Math.PI * 2); ctx.fill(); // タイヤ

    // 3. 青い展示マット (中央3箇所)
    RUG_POSITIONS.forEach(pos => {
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(pos.x, pos.y, 220, 90);
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 3;
      ctx.strokeRect(pos.x, pos.y, 220, 90);
    });

    // 4. 展示車の描画
    gameState.cars.forEach((car, index) => {
      if (car !== null) {
        const pos = RUG_POSITIONS[index];
        drawDetailedCar(pos.x + 35, pos.y + 10, car.type);
      }
    });
  }

  // ドット絵車描画エンジン（車種別の形状・カラー・パーツ再現）
  function drawDetailedCar(x, y, type) {
    ctx.save();

    // 影
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(x + 70, y + 68, 75, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'compact_red') { // ミニスマイル (赤/白ツートン)
      // ボディ
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 10, y + 20, 120, 40);
      // ルーフ (赤)
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(x + 30, y + 2, 70, 22);
      // 窓
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x + 35, y + 6, 60, 14);
      // ライト
      ctx.fillStyle = '#fde047';
      ctx.fillRect(x + 10, y + 25, 8, 12);
    } 
    else if (type === 'compact_blue') { // シティラン (ブルー)
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(x + 5, y + 18, 130, 42);
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(x + 30, y + 0, 75, 22);
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(x + 35, y + 4, 65, 15);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(x + 5, y + 24, 10, 10);
    } 
    else if (type === 'minivan_gray') { // ファミリア8 (グレーミニバン)
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(x + 0, y + 10, 145, 52);
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(x + 20, y - 5, 105, 20);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(x + 25, y - 1, 95, 15);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(x + 0, y + 18, 8, 18);
    } 
    else if (type === 'suv_red') { // ワイルドクロス (レッドSUV)
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(x + 5, y + 10, 135, 48);
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(x + 25, y - 6, 85, 22);
      // ルーフレール
      ctx.fillStyle = '#111827';
      ctx.fillRect(x + 25, y - 10, 85, 3);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x + 30, y - 2, 75, 14);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(x + 5, y + 18, 12, 14);
    } 
    else if (type === 'sedan_black') { // ロイヤルセダン (高級黒セダン)
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 5, y + 22, 155, 38);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(x + 25, y + 4, 90, 20);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(x + 35, y + 8, 70, 13);
      // フロントメッキグリル
      ctx.fillStyle = '#e5e7eb';
      ctx.fillRect(x - 5, y + 26, 6, 20);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(x - 3, y + 24, 8, 8);
    }

    // 共通パーツ: タイヤ
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 20, y + 52, 24, 16);
    ctx.fillRect(x + 95, y + 52, 24, 16);
    // ホイールキャップ
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x + 26, y + 57, 12, 6);
    ctx.fillRect(x + 101, y + 57, 12, 6);

    ctx.restore();
  }

  // --- ゲームロジック ---
  function buyCar(typeIndex) {
    const carData = CAR_TYPES[typeIndex];
    const emptyIndex = gameState.cars.findIndex(slot => slot === null);
    
    if (emptyIndex === -1) {
      showMessage("展示スペースが満車です！商談して売却してください。");
      return;
    }
    if (gameState.money < carData.cost) {
      showMessage("資金が足りません！");
      return;
    }

    gameState.money -= carData.cost;
    gameState.cars[emptyIndex] = { ...carData };

    showMessage(`「${carData.name}」を${carData.cost}万円で仕入れました！`);
    updateUI();
    draw();
  }

  function sellCar() {
    const soldIndex = gameState.cars.findIndex(slot => slot !== null);
    if (soldIndex === -1) return;

    const soldCar = gameState.cars[soldIndex];
    const profit = soldCar.sell - soldCar.cost;
    gameState.money += soldCar.sell;
    gameState.cars[soldIndex] = null;

    showMessage(`【ご成約！】「${soldCar.name}」が${soldCar.sell}万円で売れました！ (利益 +${profit}万円)`);
    updateUI();
    draw();
  }

  function updateUI() {
    document.getElementById('money').innerText = gameState.money;
    const currentCarCount = gameState.cars.filter(c => c !== null).length;
    document.getElementById('car-count').innerText = currentCarCount;

    CAR_TYPES.forEach((car, index) => {
      const card = document.getElementById(`car-${index}`);
      if (gameState.money < car.cost || currentCarCount >= 3) {
        card.classList.add('disabled');
      } else {
        card.classList.remove('disabled');
      }
    });

    document.getElementById('sell-btn').disabled = (currentCarCount === 0);
  }

  function showMessage(msg) {
    document.getElementById('message').innerText = msg;
  }

  updateUI();
  draw();
</script>

</body>
</html>
